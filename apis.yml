aid: foresight
name: Foresight
description: 'Foresight is a predictive project-delivery platform for complex construction
  and infrastructure megaprojects, with a particular focus on data centers, government,
  and critical infrastructure. Founded by Dr. Atif Ansar and Igor Shifrin (Oxford) and
  headquartered in London, it layers on top of existing scheduling tools such as Microsoft
  Project and Excel to turn raw schedule data into forecasts, risk assessment, delay
  prediction, and portfolio-wide project assurance. The company reports managing $100B+
  in mission-critical projects and is backed by Creandum and Macquarie Capital. Foresight
  is delivered as a SaaS web application and does not publish a public developer API.'
